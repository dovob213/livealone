spring:
  application:
    name: LiveAlone

  datasource:
    url: jdbc:postgresql://localhost:5432/LiveAlone
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    #validate-on-migrate: false

#    clean-disabled: false
#    clean-on-validation-error: true / just append 'flyway'

logging:
  level:
    org:
      flywaydb: DEBUG

jwt:
  secret: vS7pWz3B6y9B2E5H8KcNfUjXnZr4u7x!A%D*G-KaPdSgVkYp3s6v9y$B?E(H+MbQ
  access-expiration: 1800000 # 30 minutes
  refresh-expiration: 1209600000 # 14 days
  
