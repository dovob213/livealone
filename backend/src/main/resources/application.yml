spring:
  application:
    name: LiveAlone

  datasource:
    url: jdbc:postgresql://localhost:5433/livealone_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    org:
      flywaydb: DEBUG