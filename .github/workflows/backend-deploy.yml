name: Spring Boot Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v3

      - name: Java 17 세팅
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Gradle 권한 부여 및 빌드
        working-directory: ./backend
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: AWS로 JAR 파일 전송 (SCP)
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          source: "backend/build/libs/*SNAPSHOT.jar"
          target: "/home/ubuntu/backend-dist"

      - name: ‍스프링 부트 재시작 (SSH)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          script: |
            pid=$(pgrep -f backend-0.0.1-SNAPSHOT.jar) || true
            if [ -n "$pid" ]; then
              echo "기존 프로세스($pid) 종료 중..."
              kill -9 $pid
            fi
            
            cp /home/ubuntu/backend-dist/backend/build/libs/*SNAPSHOT.jar /home/ubuntu/
            
            nohup java -jar /home/ubuntu/backend-0.0.1-SNAPSHOT.jar > nohup.out 2>&1 &